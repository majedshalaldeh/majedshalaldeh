<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة حساب الزخم الخطي | الأستاذ ماجد شلالدة</title>
    <style>
        :root { --bg-color: #0b1329; --card-bg: #1c2541; --accent: #4cc9f0; --text: #ffffff; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; position: relative; }
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://squarespace-cdn.com'); background-size: 180px; opacity: 0.02; pointer-events: none; z-index: 0; transform: rotate(-15deg) scale(1.2); }
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        .btn { text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; border: 1px solid var(--accent); color: var(--accent); display: inline-block; margin-bottom: 20px; transition: 0.2s; }
        .btn:hover { background: var(--accent); color: var(--bg-color); }
        .sim-box { background: var(--card-bg); border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .control-group { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .control-group input { padding: 10px; border-radius: 6px; border: 1px solid #3a506b; background: #0b1329; color: #fff; width: 120px; text-align: center; }
        .result-box { font-size: 1.8rem; color: var(--accent); font-weight: bold; margin-top: 25px; padding: 15px; background: rgba(76, 201, 240, 0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="watermark"></div>
    <div class="container">
        <a href="momentum.html" class="btn">⬅ العودة للزخم الخطي</a>
        <div class="sim-box">
            <h1>🚀 محاكاة حساب الزخم الخطي (P = m · v)</h1>
            <p>إعداد الأستاذ ماجد شلالدة | جوال: 0599870176</p>
            <div class="control-group">
                <label>الكتلة (m) بالكيلوغرام:<br><input type="number" id="mass" value="5" oninput="calc()"></label>
                <label>السرعة (v) بمتر/ثانية:<br><input type="number" id="velocity" value="10" oninput="calc()"></label>
            </div>
            <div class="result-box" id="result">الزخم الخطي (P) = 50 كغم·م/ث</div>
        </div>
    </div>
    <script>
        function calc() {
            let m = parseFloat(document.getElementById('mass').value) || 0;
            let v = parseFloat(document.getElementById('velocity').value) || 0;
            document.getElementById('result').innerText = `الزخم الخطي (P) = ${(m * v).toFixed(2)} كغم·م/ث`;
        }
    </script>
</body>
</html>
