<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newton's Cradle 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eef3f6;font-family:Arial,"Tahoma",sans-serif;color:#263b46;transition:background .3s}
body.dark{background:#000}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}

.header{
 position:fixed;top:10px;left:50%;transform:translateX(-50%);
 text-align:center;pointer-events:none;z-index:10;white-space:nowrap;
}
.title{font-size:20px;font-weight:800;letter-spacing:.4px;direction:ltr}
.subtitle{margin-top:1px;font-size:11px;font-weight:700;color:#5a7684}
.author{margin-top:2px;font-size:12px;font-weight:700}
body.dark .title,body.dark .author{color:#eef3f6}
body.dark .subtitle{color:#8ea3ac}
@media(max-width:600px){.title{font-size:16px}.author{font-size:10px}.subtitle{font-size:9px}}

/* control toolbar tucked in a corner, away from the simulation stage */
.toolbar{
 position:fixed;bottom:16px;right:16px;z-index:20;
 display:flex;flex-direction:column;gap:6px;direction:rtl;align-items:stretch;
}
.toolbar button{border:0;border-radius:8px;padding:9px 14px;background:#355d70;color:#fff;
 font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);
 white-space:nowrap;transition:background .2s}
.toolbar button:hover{background:#274a5a}
body.dark .toolbar button{background:#1f2a30}
body.dark .toolbar button:hover{background:#2c3c45}
@media(max-width:600px){.toolbar{bottom:10px;right:10px;gap:5px}.toolbar button{padding:7px 11px;font-size:11px}}

/* top-right navigation, matching the site's other pages */
.navigation{position:fixed;top:10px;right:14px;z-index:20;display:flex;gap:8px;direction:rtl}
.navigation button{border:0;border-radius:8px;padding:8px 13px;background:#7b4f9e;color:#fff;
 font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.navigation button:hover{background:#633d82}
@media(max-width:600px){.navigation{top:8px;right:8px;gap:5px}.navigation button{padding:7px 10px;font-size:11px}}

.hint{position:fixed;bottom:16px;left:16px;z-index:20;
 font-size:12px;color:#5a7684;background:rgba(255,255,255,.65);padding:6px 12px;border-radius:20px;
 direction:rtl;pointer-events:none;max-width:46vw}
body.dark .hint{background:rgba(255,255,255,.08);color:#b9c6cc}
@media(max-width:600px){.hint{font-size:10px;padding:5px 9px;max-width:55vw}}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:#eef3f6;z-index:30;font-size:16px;color:#5a7684;font-weight:700}
</style>
</head>
<body>
<div class="loading" id="loading">جارٍ التحميل...</div>
<div class="header">
  <div class="title">Newton's Cradle</div>
  <div class="subtitle">نسخة ثلاثية الأبعاد</div>
  <div class="author">إعداد وتطوير: الأستاذ ماجد شلالدة — 0599870176</div>
</div>
<div class="toolbar">
  <button id="resetBtn" type="button">إعادة ضبط</button>
  <button id="playBtn" type="button">إيقاف</button>
  <button id="themeBtn" type="button">خلفية فاتحة</button>
</div>
<div class="navigation">
  <button id="homeBtn" type="button">الرئيسية</button>
  <button id="collisionBtn" type="button">صفحة التصادمات</button>
</div>
<div class="hint">اسحب كرة يميناً/يساراً لتحريكها، واسحب الخلفية لتدوير الكاميرا</div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('load', () => { if (typeof THREE === 'undefined') {
  document.getElementById('loading').textContent = 'تعذّر تحميل مكتبة الرسم ثلاثي الأبعاد (تحقق من الاتصال بالإنترنت).';
} else { document.getElementById('loading').style.display='none'; init(); } });

function init(){
const canvas=document.getElementById('canvas');

// ------------------------------------------------------------
// Simulation constants (mirrors the 2D version's tuning, scaled
// into world units; G/L ratio kept equal so the swing period feels
// the same).
// ------------------------------------------------------------
const COUNT=5;
const R=1;                 // ball radius
const D=R*2;                // rest spacing between ball centers
const L=7;                  // string length
const SPACING=D;
const PIVOT_Y=8;            // height of the pivot bar
const GROUND_Y=-0.55;        // close under the balls, so they read as resting near a surface, not floating
const G=0.0213;
const DAMP=0.99955;
const REST=0.998;
const COLORS=[0xe74c3c,0x3498db,0xf1c40f,0x2ecc71,0x9b59b6];
// A real cradle isn't pulled much past ~45-55°; keeping the max swing
// modest (vs. the very wide 2D limit) keeps the whole arc inside the
// visible stage instead of flying off past the stand's width.
const LIM=Math.PI*0.30;

let balls=[];
let running=true;

// ------------------------------------------------------------
// Renderer / scene / camera
// ------------------------------------------------------------
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(46,1,0.1,200);
const target=new THREE.Vector3(0,3.6,0);
let camTheta=0.28, camPhi=1.15, camRadius=20;
function updateCamera(){
  camPhi=Math.max(0.25,Math.min(1.45,camPhi));
  camRadius=Math.max(14,Math.min(38,camRadius));
  const x=target.x+camRadius*Math.sin(camPhi)*Math.sin(camTheta);
  const z=target.z+camRadius*Math.sin(camPhi)*Math.cos(camTheta);
  const y=target.y+camRadius*Math.cos(camPhi);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}
updateCamera();

// Lights — kept bright enough that the rig and the ground logo stay
// clearly readable, not sunk in shadow.
const hemi=new THREE.HemisphereLight(0xffffff,0xb9c6cc,0.85);
scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,1.15);
key.position.set(10,18,12);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-16;key.shadow.camera.right=16;
key.shadow.camera.top=16;key.shadow.camera.bottom=-16;
key.shadow.camera.near=1;key.shadow.camera.far=45;
key.shadow.bias=-0.0015;
scene.add(key);
const fill=new THREE.DirectionalLight(0xbcd7e8,0.55);
fill.position.set(-12,6,-10);
scene.add(fill);
const front=new THREE.DirectionalLight(0xffffff,0.35);
front.position.set(0,10,20);
scene.add(front);

// Ground — kept close under the balls (see GROUND_Y) so the rig reads
// as standing on a surface instead of hanging in empty space.
const ground=new THREE.Mesh(
  new THREE.CircleGeometry(26,48),
  new THREE.MeshStandardMaterial({color:0xc3ced4,roughness:0.9,metalness:0})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=GROUND_Y;
ground.receiveShadow=true;
scene.add(ground);

// Circular logo laid flat on the ground beneath the balls (the site's
// watermark, reused here instead of the 2D canvas watermark).
const LOGO_DATA_URL="logo.png";
const logoTexture=new THREE.TextureLoader().load(LOGO_DATA_URL);
logoTexture.encoding=THREE.sRGBEncoding||logoTexture.encoding;
const logoMat=new THREE.MeshBasicMaterial({map:logoTexture,transparent:true,depthWrite:false});
const logoDisc=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),logoMat);
logoDisc.rotation.x=-Math.PI/2;
logoDisc.position.set(0,GROUND_Y+0.01,0);
scene.add(logoDisc);

// ------------------------------------------------------------
// Theme (light / dark background), switchable at runtime
// ------------------------------------------------------------
const THEME={
  light:{bg:0xeef3f6,fog:[0xeef3f6,30,60],ground:0xc3ced4,hemiSky:0xffffff,hemiGround:0xb9c6cc},
  dark:{bg:0x030405,fog:[0x030405,22,55],ground:0x14181c,hemiSky:0x9fb4c2,hemiGround:0x05070a}
};
let isDark=true;
function applyTheme(){
  const t=isDark?THEME.dark:THEME.light;
  scene.background=new THREE.Color(t.bg);
  scene.fog=new THREE.Fog(t.fog[0],t.fog[1],t.fog[2]);
  ground.material.color.setHex(t.ground);
  hemi.color.setHex(t.hemiSky);
  hemi.groundColor.setHex(t.hemiGround);
  document.body.classList.toggle('dark',isDark);
}
applyTheme();

// ------------------------------------------------------------
// Stand (rectangular frame)
// ------------------------------------------------------------
const standMat=new THREE.MeshStandardMaterial({color:0x3f5661,roughness:0.35,metalness:0.55});
const startX=-((COUNT-1)*SPACING)/2;
const STAND_MARGIN=1.9;               // extra reach beyond the end balls, so the frame reads as sturdy
const leftX=startX-STAND_MARGIN, rightX=startX+(COUNT-1)*SPACING+STAND_MARGIN;
const railH=0.32;
const railTopY=PIVOT_Y+railH/2;       // the rail's *underside* sits exactly at PIVOT_Y, so strings visibly meet it
const zHalf=1.7;

function addBox(w,h,d,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),standMat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function addLeg(x,z){
  const h=railTopY-GROUND_Y;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,h,16),standMat);
  m.position.set(x,GROUND_Y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  addBox(0.6,0.14,0.6,x,GROUND_Y+0.07,z);
}
addBox((COUNT-1)*SPACING+STAND_MARGIN*2+0.6,railH,railH,0,railTopY,0);   // long top rail
addBox(railH,railH,zHalf*2,leftX,railTopY,0);                             // end cross-bar (left)
addBox(railH,railH,zHalf*2,rightX,railTopY,0);                            // end cross-bar (right)
addLeg(leftX,-zHalf);addLeg(leftX,zHalf);
addLeg(rightX,-zHalf);addLeg(rightX,zHalf);

// ------------------------------------------------------------
// Balls + strings + pivots
// The swing plane matches a real cradle: each ball swings in the
// vertical plane that contains the row (x = left/right) — NOT
// front/back — because a real cradle ball is hung from a pair of
// strings (bifilar suspension) that pin it to that plane. depth (z)
// is fixed per ball, only used to draw the two strings apart.
// ------------------------------------------------------------
const ballGeo=new THREE.SphereGeometry(R,40,32);
const stringGeo=new THREE.CylinderGeometry(0.028,0.028,1,8,1);
const pivotGeo=new THREE.SphereGeometry(0.1,16,12);
const pivotMat=new THREE.MeshStandardMaterial({color:0x2e424b,roughness:0.5,metalness:0.4});
const STRING_Z=0.16; // half-separation of the bifilar string pair

for(let i=0;i<COUNT;i++){
  const pivotX=startX+i*SPACING;
  const mat=new THREE.MeshStandardMaterial({color:COLORS[i],roughness:0.18,metalness:0.75,envMapIntensity:1});
  const mesh=new THREE.Mesh(ballGeo,mat);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);

  const stringMat=new THREE.MeshStandardMaterial({color:0x6f8088,roughness:0.6});
  const stringA=new THREE.Mesh(stringGeo,stringMat);
  const stringB=new THREE.Mesh(stringGeo,stringMat);
  scene.add(stringA);scene.add(stringB);

  const pivotDotA=new THREE.Mesh(pivotGeo,pivotMat);
  const pivotDotB=new THREE.Mesh(pivotGeo,pivotMat);
  pivotDotA.position.set(pivotX,PIVOT_Y,-STRING_Z);
  pivotDotB.position.set(pivotX,PIVOT_Y,STRING_Z);
  scene.add(pivotDotA);scene.add(pivotDotB);

  balls.push({
    i,pivotX,angle:0,omega:0,alpha:0,
    x:pivotX,y:0,z:0,
    mesh,stringA,stringB,chain:false,dragged:false
  });
}

function ballWorldPos(b){
  b.x=b.pivotX+Math.sin(b.angle)*L;
  b.y=PIVOT_Y-Math.cos(b.angle)*L;
  // b.z stays 0 — the ball never leaves the row's vertical plane
}
function orientString(mesh,p1,p2){
  const dir=new THREE.Vector3().subVectors(p2,p1);
  const len=dir.length();
  mesh.position.copy(p1).addScaledVector(dir,0.5);
  mesh.scale.set(1,len,1);
  if(len>1e-6){
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    mesh.quaternion.copy(q);
  }
}
function syncMesh(b){
  b.mesh.position.set(b.x,b.y,b.z);
  orientString(b.stringA,new THREE.Vector3(b.pivotX,PIVOT_Y,-STRING_Z),new THREE.Vector3(b.x,b.y,b.z));
  orientString(b.stringB,new THREE.Vector3(b.pivotX,PIVOT_Y,STRING_Z),new THREE.Vector3(b.x,b.y,b.z));
}
function updateAll(){for(const b of balls){ballWorldPos(b);syncMesh(b);}}
function reset(){
  for(const b of balls){b.angle=0;b.omega=0;b.alpha=0;b.chain=false;b.dragged=false;}
  updateAll();
}
reset();

// ------------------------------------------------------------
// Collision sound (Web Audio) — same design as the 2D version.
// ------------------------------------------------------------
let audioCtx=null,masterGain=null,lastSoundTime=0;
function ensureAudio(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain();masterGain.gain.value=0.8;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function collisionSound(strength){
  ensureAudio();
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime;
  if(now-lastSoundTime<0.045)return;
  lastSoundTime=now;
  const power=Math.max(0.35,Math.min(1.8,strength));
  const level=Math.min(0.42,0.16+power*0.16);
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(240+Math.min(260,power*150),now);
  osc.frequency.exponentialRampToValueAtTime(75,now+0.11);
  gain.gain.setValueAtTime(level,now);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.13);
  osc.connect(gain);gain.connect(masterGain);
  osc.start(now);osc.stop(now+0.14);
  const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*0.055),audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){const env=1-i/data.length;data[i]=(Math.random()*2-1)*env*0.22*power;}
  const noise=audioCtx.createBufferSource();
  const filter=audioCtx.createBiquadFilter();
  const ng=audioCtx.createGain();
  filter.type='bandpass';filter.frequency.value=900;filter.Q.value=1.2;
  ng.gain.setValueAtTime(0.35*power,now);
  ng.gain.exponentialRampToValueAtTime(0.0001,now+0.055);
  noise.buffer=buffer;noise.connect(filter);filter.connect(ng);ng.connect(masterGain);
  noise.start(now);noise.stop(now+0.06);
}

// ------------------------------------------------------------
// Physics
// ------------------------------------------------------------
function projectAngle(b){
  b.angle=Math.atan2(b.x-b.pivotX,PIVOT_Y-b.y);
  b.angle=Math.max(-LIM,Math.min(LIM,b.angle));
  ballWorldPos(b);
}
function physics(){
  if(running){
    for(const b of balls){
      if(b.chain||b.dragged)continue;
      b.alpha=-(G/L)*Math.sin(b.angle);
      b.omega+=b.alpha;
      b.omega*=DAMP;
      b.angle+=b.omega;
    }
    for(const b of balls)ballWorldPos(b);
    resolveCollisions();
    for(const b of balls)ballWorldPos(b);
  }
  for(const b of balls)syncMesh(b);
}
function resolveCollisions(){
  for(let iter=0;iter<6;iter++){
    for(let i=0;i<COUNT-1;i++){
      const a=balls[i],b=balls[i+1];
      if(a.chain||b.chain)continue;
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d>=D)continue;
      if(d<1e-9){dx=1;dy=0;d=1;}
      const nx=dx/d,ny=dy/d,over=D-d;
      a.x-=nx*over*.5;a.y-=ny*over*.5;
      b.x+=nx*over*.5;b.y+=ny*over*.5;
      projectAngle(a);projectAngle(b);
      const avx=Math.cos(a.angle)*a.omega*L, avy=Math.sin(a.angle)*a.omega*L;
      const bvx=Math.cos(b.angle)*b.omega*L, bvy=Math.sin(b.angle)*b.omega*L;
      const rel=(bvx-avx)*nx+(bvy-avy)*ny;
      if(rel>=0)continue;
      collisionSound(Math.abs(rel));
      const impulse=-(1+REST)*rel/2;
      const ix=impulse*nx,iy=impulse*ny;
      const navx=avx-ix,navy=avy-iy,nbvx=bvx+ix,nbvy=bvy+iy;
      a.omega=(navx*Math.cos(a.angle)+navy*Math.sin(a.angle))/L;
      b.omega=(nbvx*Math.cos(b.angle)+nbvy*Math.sin(b.angle))/L;
    }
  }
}

// ------------------------------------------------------------
// Pointer interaction: drag a ball, or rotate the camera when
// the background is grabbed. Uses the Pointer Events API so mouse,
// touch and pen all share one code path.
// ------------------------------------------------------------
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const ballMeshes=balls.map(b=>b.mesh);

let dragged=null,chainGroup=[];
let rotating=false,lastPX=0,lastPY=0;

function setNDC(e){
  const r=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
}
function pickBall(e){
  setNDC(e);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(ballMeshes);
  if(!hits.length)return null;
  return balls[ballMeshes.indexOf(hits[0].object)];
}
function angleFromPointer(b,e){
  setNDC(e);
  raycaster.setFromCamera(ndc,camera);
  // the swing plane is z=0 (same plane as the row) — drag left/right, not toward/away from camera
  const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
  const pt=new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane,pt))return b.angle;
  let a=Math.atan2(pt.x-b.pivotX,PIVOT_Y-pt.y);
  return Math.max(-LIM,Math.min(LIM,a));
}
// A real cradle ball is only free to move if nothing is in the way, so
// pulling it drags along every ball between it and the end it's being
// pulled toward. Direction is read from the initial left/right drag.
let dragStartX=0,dragDirection=0;
function buildChain(b,direction){
  chainGroup=[];
  if(direction<0){for(let i=0;i<=b.i;i++)chainGroup.push(balls[i]);}
  else if(direction>0){for(let i=b.i;i<COUNT;i++)chainGroup.push(balls[i]);}
  else{chainGroup=[b];}
  balls.forEach(x=>x.chain=false);
  chainGroup.forEach(x=>{x.chain=true;x.omega=0;});
}

canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  const b=pickBall(e);
  if(b){
    dragged=b;b.dragged=true;dragStartX=e.clientX;dragDirection=0;
    buildChain(b,0);
    canvas.classList.add('dragging');
  }else{
    rotating=true;lastPX=e.clientX;lastPY=e.clientY;
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(dragged){
    if(dragDirection===0 && Math.abs(e.clientX-dragStartX)>4){
      dragDirection=e.clientX>dragStartX?1:-1;
      buildChain(dragged,dragDirection);
    }
    const target=angleFromPointer(dragged,e);
    for(const b of chainGroup){b.angle=target;ballWorldPos(b);}
  }else if(rotating){
    const dx=e.clientX-lastPX,dy=e.clientY-lastPY;
    lastPX=e.clientX;lastPY=e.clientY;
    camTheta-=dx*0.006;camPhi-=dy*0.006;
    updateCamera();
  }
});
function endPointer(){
  if(dragged){
    balls.forEach(b=>{b.dragged=false;b.chain=false;});
    dragged=null;chainGroup=[];
    canvas.classList.remove('dragging');
  }
  rotating=false;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  camRadius+=e.deltaY*0.015;
  updateCamera();
},{passive:false});

// ------------------------------------------------------------
// UI buttons
// ------------------------------------------------------------
const resetBtn=document.getElementById('resetBtn');
const playBtn=document.getElementById('playBtn');
const themeBtn=document.getElementById('themeBtn');
resetBtn.addEventListener('click',()=>{ensureAudio();reset();running=true;playBtn.textContent='إيقاف';});
playBtn.addEventListener('click',()=>{ensureAudio();running=!running;playBtn.textContent=running?'إيقاف':'تشغيل';});
themeBtn.addEventListener('click',()=>{
  isDark=!isDark;
  applyTheme();
  themeBtn.textContent=isDark?'خلفية فاتحة':'خلفية داكنة';
});
document.getElementById('homeBtn').addEventListener('click',()=>{window.location.href='../../index.html';});
document.getElementById('collisionBtn').addEventListener('click',()=>{window.location.href='collisions.html';});


// ------------------------------------------------------------
// Resize + main loop
// ------------------------------------------------------------
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

function animate(){
  physics();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
}
</script>
</body>
</html>
