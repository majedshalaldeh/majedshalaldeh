<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكاة حفظ الزخم الزاوي | الأستاذ ماجد شلالدة</title>
    <style>
        :root { --bg-color: #0b1329; --card-bg: #1c2541; --accent: #b5179e; --text: #ffffff; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://squarespace-cdn.com'); background-size: 180px; opacity: 0.02; pointer-events: none; z-index: 0; transform: rotate(-15deg) scale(1.2); }
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        .btn { text-decoration: none; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); display: inline-block; margin-bottom: 20px; }
        .sim-box { background: var(--card-bg); border-radius: 12px; padding: 30px; text-align: center; }
        .control-group { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .control-group input { padding: 10px; border-radius: 6px; border: 1px solid #3a506b; background: #0b1329; color: #fff; width: 120px; text-align: center; }
        .result-box { font-size: 1.6rem; color: var(--accent); margin-top: 25px; padding: 15px; background: rgba(181, 23, 158, 0.1); border-radius: 8px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="watermark"></div>
    <div class="container">
        <a href="rotation.html" class="btn">⬅ العودة للحركة الدورانية</a>
        <div class="sim-box">
            <h1>⛸️ محاكاة قانون حفظ الزخم الزاوي (L = I · ω)</h1>
            <p>إعداد الأستاذ ماجد شلالدة</p>
            <div class="control-group">
                <label>القصور الذاتي الابتدائي (I_i):<br><input type="number" id="ii" value="10" oninput="calc()"></label>
                <label>السرعة الزاوية الابتدائية (ω_i):<br><input type="number" id="wi" value="2" oninput="calc()"></label>
                <label>القصور الذاتي النهائي (I_f):<br><input type="number" id="if" value="5" oninput="calc()"></label>
            </div>
            <div class="result-box" id="result">الزخم الزاوي المحفوظ (L) = 20.00 كغم·م²/ث<br>السرعة الزاوية النهائية الناتجة (ω_f) = 4.00 راد/ث</div>
        </div>
    </div>
    <script>
        function calc() {
            let ii = parseFloat(document.getElementById('ii').value) || 0;
            let wi = parseFloat(document.getElementById('wi').value) || 0;
            let iff = parseFloat(document.getElementById('if').value) || 1;
            let L = ii * wi;
            let wf = L / iff;
            document.getElementById('result').innerHTML = `الزخم الزاوي المحفوظ (L) = ${L.toFixed(2)} كغم·م²/ث<br>السرعة الزاوية النهائية الناتجة (ω_f) = ${wf.toFixed(2)} راد/ث`;
        }
    </script>
</body>
</html>
